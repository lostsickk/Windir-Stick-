
name: Build WINDIR MODE IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Crear configuración iOS
        run: |
          cat > project-ci.yml <<'EOF'
          name: WINDIR-MODE
          options:
            bundleIdPrefix: com.dnxmodz
            deploymentTarget:
              iOS: "15.0"
          targets:
            WINDIRMODE:
              type: application
              platform: iOS
              sources:
                - path: ContentView.swift
                - path: WINDIRMODEApp.swift
                - path: index.html
                  buildPhase: resources
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.dnxmodz.windirmode
                  PRODUCT_NAME: WINDIR-MODE
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          EOF

      - name: Generar proyecto Xcode
        run: xcodegen generate --spec project-ci.yml

      - name: Compilar aplicación
        run: |
          xcodebuild \
            -project WINDIR-MODE.xcodeproj \
            -scheme WINDIRMODE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Crear IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/WINDIR-MODE.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r WINDIR-MODE-unsigned.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: WINDIR-MODE-unsigned-IPA
          path: WINDIR-MODE-unsigned.ipa
